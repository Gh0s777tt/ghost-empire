# gitleaks — konfiguracja dla twardej bramki sekretów w .gitlab-ci.yml (job `gitleaks`).
# Rozszerza domyślny zestaw reguł gitleaks i dokłada allowlistę na PLIKI-SZABLONY
# środowiska, które zawierają wyłącznie placeholdery (nie realne sekrety) — inaczej
# reguła connection-string dawałaby false-positive i czerwieniła nawet MR-y.
#
# UWAGA: job skanuje bieżące pliki (`--no-git`), nie całą historię — allowlista
# `paths` odnosi się do ścieżek plików w drzewie roboczym.

title = "ghost-empire gitleaks config"

[extend]
# Zacznij od pełnego domyślnego zestawu reguł gitleaks, dołóż tylko allowlistę.
useDefault = true

[allowlist]
description = "Placeholdery w szablonach env — brak realnych sekretów"
paths = [
  '''ghost-empire-web/\.env\.example$''',
  # TYLKO szablon, nie `tenants/.*\.env$`. Ten glob przepuszczał KAŻDY plik env
  # floty (`tenants/neo-zone.env` itd.) — a to są realne, per-portal poświadczenia
  # (BOT_SECRET, TWITCH/KICK/GOOGLE_CLIENT_SECRET, YOUTUBE_BOT_REFRESH_TOKEN).
  # Razem z brakiem `tenants/*.env` w .gitignore dawało to komplet sekretów, który
  # dało się scommitować I który twarda bramka `gitleaks` przepuszczała bez słowa. (#audit)
  '''ghost-empire-chat/tenants/example-tenant\.env$''',
  '''.*\.env\.example$''',
]
# Dodatkowo wycisz typowe wartości-placeholdery, gdyby pojawiły się w innych plikach
# dokumentacji (np. README/docs z przykładowym connection-string).
#
# UWAGA co do zakresu: `paths` i `regexes` w JEDNYM bloku `[allowlist]` są łączone
# przez OR (dopasowanie któregokolwiek = finding wyciszony), NIE przez AND. Dlatego
# fałszywy alarm na konkretnej WARTOŚCI wycisza się regexem na tej wartości, a nie
# przez dopisanie jej pliku do `paths` — to wyciszyłoby cały plik. Każdy wpis niżej
# ma być dosłowną, wąską wartością (nie wzorcem typu `.*KEY.*`), bo to jedyna bramka
# na sekrety w CI.
regexes = [
  '''PROJECT_REF''',
  '''<[A-Z_]+>''',
  '''postgres:postgres@''',
  '''dummy-build-time-secret-not-a-real-secret''',
  # NAZWA klucza w localStorage (`GamblingGate.tsx` — zgoda 18+ zapisywana po stronie
  # klienta), nie sekret: to identyfikator wpisu, jawny z definicji, bo siedzi w
  # przeglądarce użytkownika. Reguła `generic-api-key` łapała go po entropii (3.53)
  # przez sam wzorzec `const ACK_KEY = "..."`. Wycisz TĘ wartość, nie regułę i nie plik.
  '''ge-gambling-ack-v1''',
]
