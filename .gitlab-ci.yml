# GitLab CI/CD — źródło prawdy dla całego pipeline'u (GitHub Actions w tym repo
# nie działa; NIE dodawać niczego w .github/workflows/).
#
# ETAP 3 (dokumentacja jako kod): build MkDocs Material → GitLab Pages przy każdym
# mergu do `main`, oraz strażnik świeżości docs na Merge Requestach. ZACHOWANE 1:1
# (jedyna zmiana: `needs: []` na jobach docs — patrz sekcja DOCS).
# ETAP 4 (ten plik): verify (commitlint) · lint · test · build · e2e (Playwright) ·
# security (gitleaks/semgrep/trivy) · docs · release (semantic-release) · renovate.
# GitLab shared runners (Linux/docker), obrazy publiczne, npm (lockfileVersion 3;
# ghost-empire-web/.npmrc: legacy-peer-deps=true). Monorepo: kod w podfolderach
# `ghost-empire-web/` (Next 16) i `ghost-empire-chat/` (bot, tsx — bez kroku build).
#
# DECYZJA O SECURITY (świadoma — patrz residualRisks): NIE używamy szablonów
# Security/*.gitlab-ci.yml. Powód: nadpisywanie ich jobów po nazwie (np.
# `gemnasium-dependency_scanning`) jest kruche — nazwy analizatorów zmieniają się
# między wersjami GitLaba, a nadpisanie NIEISTNIEJĄCEGO joba unieważnia CAŁY YAML
# (job bez `script`) → pipeline w ogóle nie startuje. Dodatkowo joby szablonowe są
# domyślnie `allow_failure: true` (fałszywy zielony). Zamiast tego: w pełni
# samodzielne, PRZYPIĘTE wersjami skanery — gitleaks (SEKRETY, twarda bramka),
# semgrep (SAST, doradcze) i trivy (zależności/CVE, doradcze). Joby doradcze przy
# findings pokazują w GitLab POMARAŃCZOWE ostrzeżenie (nie zielony) — brak fałszywego
# zielonego.

stages:
  - verify
  - lint
  - test
  - build
  # `e2e` MUSI być osobnym stage'em PO `build`: Playwright startuje apkę przez
  # `npm run start` (next start), a to wymaga artefaktu `.next/` z `build:web`. W stage
  # `test` (który leci PRZED `build`) nie byłoby czego uruchomić.
  - e2e
  - security
  - docs
  - release

variables:
  NPM_FLAGS: "--no-audit --no-fund"
  NEXT_TELEMETRY_DISABLED: "1"

# ── Zapobieganie podwójnym pipeline'om (MR + branch) ─────────────────────────
# Pipeline TYLKO dla: MR-ów, gałęzi domyślnej (main) oraz harmonogramu. Push do
# zwykłej gałęzi feature bez MR nie odpala CI.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ── Ukryte szablony jobów (DRY) ──────────────────────────────────────────────
# Cache node_modules per-projekt, kluczowany hashem lockfile'a danego projektu.
.web:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - ghost-empire-web/package-lock.json
    paths:
      - ghost-empire-web/node_modules/
    policy: pull-push
  before_script:
    - cd ghost-empire-web
    - npm ci $NPM_FLAGS   # postinstall → `prisma generate`; .npmrc wymusza legacy-peer-deps
  interruptible: true

.chat:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - ghost-empire-chat/package-lock.json
    paths:
      - ghost-empire-chat/node_modules/
    policy: pull-push
  before_script:
    - cd ghost-empire-chat
    - npm ci $NPM_FLAGS
  interruptible: true

# ── Ukryte reguły (referencjonowane przez !reference) ────────────────────────
# Lekkie bramki jakości: MR + main (ale NIE harmonogramy — na schedule nie ma sensu
# powtarzać lint/test/build; wyklucza to też przypadkowe wydanie z nocnego skanu).
.rules_mr_main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

# Skany bezpieczeństwa: MR + main + nocny harmonogram (ale NIE harmonogram renovate).
# MR łapie regresje przed mergem; nocny schedule łapie nowo ujawnione CVE w
# niezmienionych zależnościach. Reguła main wyklucza schedule, żeby na nocnym skanie
# biegły WYŁĄCZNIE skany (trzecia reguła), a nie lint/test/build.
.rules_scan:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE != "true"'

# Renovate: WYŁĄCZNIE dedykowany harmonogram ze zmienną RENOVATE=true — nie koliduje
# z nocnym harmonogramem skanów.
.rules_renovate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"'

# ═════════════════════════════════════════════════════════════════════════════
#  VERIFY — Conventional Commits (serwerowy odpowiednik hooka commit-msg)
# ═════════════════════════════════════════════════════════════════════════════
# Lokalne hooki (lefthook) są omijalne (--no-verify), więc walidacja jest też po
# stronie serwera. Używamy `npm install --no-save` (a NIE `npm ci`), żeby job był
# ODPORNY na brak root package-lock.json (bootstrap) — commitlint leci na KAŻDYM MR.
commitlint:
  stage: verify
  image: node:22-bookworm-slim
  needs: []
  rules:
    # commitlint TYLKO na MR: na push do main CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    # jest puste → `git fetch origin ""` by padło i zaczerwieniło main. Na main nie
    # ma czego walidować (commity już zmergowane).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - npm install --no-save @commitlint/cli @commitlint/config-conventional conventional-changelog-conventionalcommits
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth 100
    - npx commitlint --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD --verbose
  interruptible: true

# ═════════════════════════════════════════════════════════════════════════════
#  LINT — typecheck + eslint (web) i typecheck (chat)
# ═════════════════════════════════════════════════════════════════════════════
lint:web:
  extends: .web
  stage: lint
  needs: []
  script:
    - npm run typecheck        # tsc --noEmit
    - npm run lint             # eslint .
    - npm run docs:check       # node scripts/check-docs-sync.mjs (bramka anty-drift)
    - npm run docs:env         # node scripts/check-env-docs.mjs (każdy process.env.X udokumentowany w ENV.md)
    - npm run docs:i18n        # scripts/check-i18n-legal.mjs (copy prawne obecne w KAŻDYM locale)
    - npm run docs:i18n:dup    # scripts/check-i18n-duplicates.mjs (zero zduplikowanych kluczy w src/messages/*.json)
  rules: !reference [.rules_mr_main, rules]

# ghost-empire-chat: `typecheck` + `lint:brand` + `test` (brak eslint/build — tsx odpala TS wprost).
lint:chat:
  extends: .chat
  stage: lint
  needs: []
  script:
    - npm run typecheck        # tsc --noEmit
    - npm run lint:brand       # tsx scripts/check-white-label.ts (AST: brak founderowych literałów w copy na czat)
  rules: !reference [.rules_mr_main, rules]

# ═════════════════════════════════════════════════════════════════════════════
#  TEST — jednostkowe (+coverage badge) oraz integracyjne (real Postgres)
# ═════════════════════════════════════════════════════════════════════════════
# Jednostkowe: bez bazy (vitest.setup.ts wstrzykuje atrapy DATABASE_URL). Reporter
# coverage w vitest.config.ts to `text-summary` → drukuje wiersz "Statements : NN%",
# stąd regex poniżej (NIE 'All files' — tego ten reporter NIE drukuje). UWAGA (audyt):
# `coverage:` wyciąga TYLKO liczbę na badge — nie porównuje jej z żadną podłogą, więc ten
# job nadal nie failuje na spadku pokrycia. Bramką może być WYŁĄCZNIE `thresholds` w
# vitest.config.ts (wtedy sam vitest kończy się kodem != 0 i job czerwienieje). Progi
# jeszcze NIE są ustawione — mają być RATCHETEM (kilka punktów pod REALNIE zmierzonym
# pokryciem: zielono dziś, czerwono tylko na regresji), a pomiaru nie dało się wykonać;
# procedura i ostatni zapisany pomiar są opisane w ghost-empire-web/vitest.config.ts.
# Bot: wbudowany test runner Node (`node:test`) odpalany przez tsx — świadomie BEZ vitesta,
# bo jedyne dev-tooling bota to tsx + tsc i nie chcemy tam nowej zależności. Pilnuje
# inwariantów `src/branding.ts`: awaria portalu schodzi na neutralne „tokeny" (NIGDY na „GT"),
# back-off zamiast round-tripu na wiadomość, brak rzutu w ścieżkę czatu.
test:chat:
  extends: .chat
  stage: test
  needs: ["lint:chat"]
  script:
    - npm test                 # tsx --test src/__tests__/*.test.ts
  rules: !reference [.rules_mr_main, rules]

test:unit:web:
  extends: .web
  stage: test
  needs: ["lint:web"]
  script:
    - npm run test:coverage    # vitest run --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ghost-empire-web/coverage/
  rules: !reference [.rules_mr_main, rules]

# Integracyjne: WYMAGAJĄ realnego Postgresa → `services: postgres:16`. Jawny wait
# (pg_isready) usuwa wyścig przy cache-hit node_modules. globalSetup i tak robi
# `prisma db push`, ale odpalamy go też jawnie (idempotentnie), by schemat na 100%
# istniał przed testami. Ustawiamy wszystkie warianty URL (db-url.ts →
# TEST_DATABASE_URL; prisma.config.ts → TEST_DATABASE_URL ?? DIRECT_URL ??
# DATABASE_URL; vitest.integration.config.ts → TEST_DB_URL).
test:integration:web:
  extends: .web
  stage: test
  needs: ["lint:web"]
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: ghost_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
    TEST_DB_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
    DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - cd ghost-empire-web
    - npm ci $NPM_FLAGS
    - until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres..."; sleep 1; done
  script:
    - npx prisma db push   # plain: Prisma 7 czyta schema+URL z prisma.config.ts (flagi konfliktują)
    - npm run test:integration             # vitest run --config vitest.integration.config.ts
  rules: !reference [.rules_mr_main, rules]

# ═════════════════════════════════════════════════════════════════════════════
#  BUILD — produkcyjny `next build` (web). Chat nie ma kroku build.
# ═════════════════════════════════════════════════════════════════════════════
# Build NIE wymaga bazy (adapter Prisma leniwy; strony z danymi force-dynamic; jedyny
# generateStaticParams jest DB-free). Nieszkodliwe env-stuby, by nic nie rzuciło na
# etapie importu/konfiguracji. UWAGA: `next/font/google` pobiera fonty z sieci przy
# buildzie (shared runnery mają internet — OK). Twarda bramka (bez allow_failure).
build:web:
  extends: .web
  stage: build
  needs: ["lint:web"]
  variables:
    DATABASE_URL: "postgresql://build:build@localhost:5432/build"   # stub, nieużywany
    NEXTAUTH_SECRET: "dummy-build-time-secret-not-a-real-secret"
    NEXTAUTH_URL: "http://localhost:3000"
  script:
    - npm run build            # next build --turbopack
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - ghost-empire-web/.next/
  rules: !reference [.rules_mr_main, rules]

# ═════════════════════════════════════════════════════════════════════════════
#  E2E — Playwright na REALNIE uruchomionej aplikacji (smoke)
# ═════════════════════════════════════════════════════════════════════════════
# DLACZEGO TO ISTNIEJE (audyt): `e2e/smoke.spec.ts` nie był wpięty w ŻADNĄ bramkę — ani
# tutaj, ani w `ghost-empire-web/scripts/verify-all.sh` — mimo że jest JEDYNYM automatycznym
# strażnikiem nonce/strict-dynamic CSP budowanego w `src/proxy.ts`, i jedynym pokryciem dla
# pingu DB w `/api/health`, content-type dynamicznego OG, per-tenantowego `og:image` oraz 401
# gościa na `/api/gt-games/play`. TEST_REPORT.md §7 zapisał ten skip jako świadomie tymczasowy
# ("Faza 3 pominięta świadomie") — i stał się trwały. To go przywraca.
#
# BAZA: ten sam `postgres:16` co `test:integration:web`, z tym samym jawnym `pg_isready`
# (cache-hit na node_modules potrafi wyprzedzić start serwisu → wyścig). `prisma db push`
# daje schemat, `db:seed` zakłada tenanta `ghost-empire` — na pustej bazie strony i `og:image`
# nie mają czego czytać. Redis ŚWIADOMIE niewpięty: `jackpotPool()` bez redisa zwraca
# `JACKPOT_SEED` = 5000, czyli dokładnie próg, którego oczekuje test puli jackpota (>= 5000).
#
# PRZEGLĄDARKA: `npx playwright install --with-deps chromium` zamiast przypiętego obrazu
# `mcr.microsoft.com/playwright:vX` — obraz trzeba by ręcznie trzymać w zgodzie z wersją
# `@playwright/test` z lockfile'a (renovate bumpuje lockfile, NIE obraz), a rozjazd = twarde
# "Executable doesn't exist". Instalacja z poziomu zainstalowanego pakietu jest z definicji
# spójna; ceną jest pobranie chromium w każdym przebiegu.
#
# `allow_failure: true` — ŚWIADOMIE i UCZCIWIE: tego joba NIE udało się przepuścić przed
# wpięciem (maszyna autora ma node_modules zbudowane pod darwin-arm64, więc ani vitest, ani
# playwright tam nie startują), a wpinanie niezweryfikowanego joba jako TWARDEJ bramki
# zaczerwieniłoby main na czymś, czego nikt nie sprawdził — to ta sama choroba co
# `release` niżej. ZDEJMIJ `allow_failure`, gdy job przejdzie na zielono co najmniej raz na
# realnym runnerze i potwierdzisz, że:
#   (1) wszystkie przypadki z `e2e/smoke.spec.ts` przechodzą na ŚWIEŻO zaseedowanej bazie
#       (kandydaci na flaka: "pages carry a per-tenant og:image" i asercje liczące elementy
#       DOM — zależą od danych tenanta, nie od czystej logiki),
#   (2) `npx playwright install --with-deps chromium` mieści się w limicie czasu joba,
#   (3) `next start` z artefaktu `build:web` wstaje pod http://localhost:3000 w 120 s
#       (`webServer.timeout` w playwright.config.ts).
e2e:web:
  extends: .web
  stage: e2e
  needs: ["build:web"]   # pobiera artefakt ghost-empire-web/.next/ — bez niego `next start` nie ruszy
  allow_failure: true
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: ghost_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    # prisma.config.ts czyta TEST_DATABASE_URL ?? DIRECT_URL ?? DATABASE_URL; apka w RUNTIME
    # czyta DATABASE_URL — tu liczy się runtime, bo testy pukają w żywy serwer, nie w vitest.
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
    DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/ghost_test"
    # Stuby jak w build:web — smoke nigdy się nie loguje, sprawdza tylko, że auth wall ODRZUCA gościa.
    NEXTAUTH_SECRET: "dummy-e2e-secret-not-a-real-secret"
    NEXTAUTH_URL: "http://localhost:3000"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - cd ghost-empire-web
    - npm ci $NPM_FLAGS
    - npx playwright install --with-deps chromium
    - until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres..."; sleep 1; done
  script:
    - npx prisma db push   # plain: Prisma 7 czyta schema+URL z prisma.config.ts (flagi konfliktują)
    - npm run db:seed      # tenant "ghost-empire" + dane bazowe
    - npm run test:e2e     # playwright test (webServer = `npm run start` na .next z build:web)
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ghost-empire-web/playwright-report/
      - ghost-empire-web/test-results/
  rules: !reference [.rules_mr_main, rules]

# ═════════════════════════════════════════════════════════════════════════════
#  SECURITY — samodzielne skanery (bez szablonów). Obrazy PRZYPIĘTE wersjami.
# ═════════════════════════════════════════════════════════════════════════════
# gitleaks — SEKRETY, TWARDA BRAMKA (allow_failure domyślnie false). Skanuje BIEŻĄCE
# pliki (`--no-git`), nie całą historię — nie utknie na czerwono przez sekret z (już
# zrotowanej) starej historii, a i tak łapie sekret wprowadzany TERAZ. `.gitleaks.toml`
# (allowlist) wycisza placeholdery w *.env.example / tenants/*.env.
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  needs: []
  script:
    - gitleaks version
    - gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
  rules: !reference [.rules_scan, rules]
  interruptible: true

# semgrep — SAST (p/ci + p/typescript). DORADCZE (allow_failure:true): na realnym
# drzewie Next 16 / React 19 reguły niemal zawsze coś zgłoszą; twarda bramka
# blokowałaby całą pracę. Findings = POMARAŃCZOWE ostrzeżenie (nie zielony) + raport
# joba. Aby uczynić bramkę twardą: usuń allow_failure po triażu.
semgrep:
  stage: security
  image:
    name: semgrep/semgrep:1.85.0
    entrypoint: [""]
  needs: []
  allow_failure: true
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - semgrep --version
    - semgrep scan --error --config p/ci --config p/typescript ghost-empire-web ghost-empire-chat
  rules: !reference [.rules_scan, rules]
  interruptible: true

# trivy — skan zależności (fs, scanner vuln). DORADCZE (allow_failure:true): duże
# drzewo npm niemal na pewno ma ≥1 HIGH/CRITICAL CVE; twarda bramka blokowałaby
# wszystko do ręcznego triażu. Przebieg 1 = informacyjny (LOW/MEDIUM, exit 0);
# przebieg 2 = HIGH/CRITICAL (exit 1) → job-warning. Aby zablokować realnie: usuń
# allow_failure i dodaj `.trivyignore` na zaakceptowane CVE.
trivy:
  stage: security
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  needs: []
  allow_failure: true
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy --version
    - trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM --exit-code 0 ghost-empire-web ghost-empire-chat
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 ghost-empire-web ghost-empire-chat
  rules: !reference [.rules_scan, rules]
  interruptible: true

# ═════════════════════════════════════════════════════════════════════════════
#  DOCS — ETAP 3, zachowane 1:1 (JEDYNA zmiana: `needs: []`)
# ═════════════════════════════════════════════════════════════════════════════
# `needs: []` to WYMAGANA naprawa regresji ETAP 3: bez tego `pages` (stage docs, po
# `security`) czekałby na stage security — gdyby skan był opóźniony, publikacja
# GitLab Pages by stanęła. `needs: []` czyni docs NIEZALEŻNYMI od bramek kodu
# (startują od razu). Logika/skrypty jobów pozostają nietknięte.

# ── Dokumentacja → GitLab Pages ──────────────────────────────────────────────
# Buduje statyczny serwis MkDocs (Material) i publikuje go na
# https://gh0s777tt.gitlab.io/ghost-empire/. Referencja API (TypeDoc, markdown)
# jest generowana z kodu tuż przed buildem, więc zawsze zgadza się ze źródłem.
pages:
  stage: docs
  image: node:22-bookworm-slim
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  cache:
    key: pages-npm
    paths:
      - ghost-empire-web/node_modules/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-pip
    - pip3 install --break-system-packages --no-cache-dir "mkdocs-material>=9.5" mkdocs-awesome-pages-plugin
  script:
    # 1) Referencja API z kodu (TypeDoc → docs/api/*.md) — zawsze zgodna ze źródłem
    - cd ghost-empire-web && npm ci --no-audit --no-fund && npm run docs:api && cd ..
    # 2) Statyczny serwis (non-strict: setki generowanych stron API nie mieszczą się
    #    w jawnym nav; linki w docs curated są zweryfikowane osobno)
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  interruptible: true

# ── Strażnik świeżości dokumentacji (Merge Request) ──────────────────────────
# Failuje MR, gdy zmieniono publiczne trasy API bez aktualizacji dokumentacji.
docs-drift:
  stage: docs
  image: alpine:3.20
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth 50
    - CHANGED=$(git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD)
    - echo "$CHANGED"
    - |
      if echo "$CHANGED" | grep -qE '^ghost-empire-web/src/app/api/.*route\.ts$'; then
        if ! echo "$CHANGED" | grep -qE '^docs/'; then
          echo ""
          echo "✗ Zmieniono trasy API (src/app/api/**/route.ts) bez aktualizacji docs/."
          echo "  Zaktualizuj docs/ENDPOINTS.md (i ewentualnie ARCHITECTURE.md) w tym samym MR."
          exit 1
        fi
      fi
    - echo "✓ docs w zgodzie ze zmianami API"
  interruptible: true

# ═════════════════════════════════════════════════════════════════════════════
#  RELEASE — semantic-release (tylko main, po przejściu test/build)
# ═════════════════════════════════════════════════════════════════════════════
# REALNA konfiguracja (nie szkielet): root .releaserc.json + root package.json z
# devDep semantic-release + pluginami. Po mergu do main: analiza Conventional Commits
# → wersja SemVer → tag vX.Y.Z → Release na GitLab → wpis w CHANGELOG.md (commit
# zwrotny z [skip ci] — brak pętli).
#
# ⚠️ AUDYT: TEN JOB NIE WYDAŁ JESZCZE ANI JEDNEGO RELEASE'U — I W OBECNYM STANIE REPO
# NIE MOŻE. `npm ci` twardo failuje bez lockfile'a, a root `package-lock.json` NIE
# ISTNIEJE: nie ma go ani na dysku, ani w gicie (`git ls-files | grep -x package-lock.json`
# → pusto; zalockowane są tylko `ghost-empire-web/` i `ghost-empire-chat/`). Więc
# `npx semantic-release` nigdy się nie uruchamia. Dowód z historii: 1005 commitów,
# DOKŁADNIE JEDEN tag (`v0.1.0`, założony ręcznie 2026-07-16) i ZERO commitów
# `chore(release):`.
#
# Dlaczego nikt tego nie zauważył: `allow_failure: true` z komentarzem opisującym się jako
# BOOTSTRAP-GUARD do zdjęcia „PO pierwszym udanym wydaniu" — czyli po zdarzeniu, które przy
# tej konfiguracji nie może nastąpić. Awaria była więc niewidoczna, a `docs/MAINTENANCE.md`
# do dziś twierdzi, że „wersje wydają się automatycznie z Conventional Commits". Nie wydają się.
#
# ZAMIAST CICHEJ AWARII — JAWNY PRECHECK (patrz `before_script`): job zatrzymuje się z
# czytelnym komunikatem NAZYWAJĄCYM brakujący warunek, zamiast wywalać się na `npm ci`
# z generycznym błędem npm. `allow_failure` ZOSTAJE, dopóki warunki nie są spełnione —
# ale teraz pomarańczowy job mówi, CZEGO brakuje.
#
# ŻEBY TO WŁĄCZYĆ (kolejność ma znaczenie):
#   1. Wygeneruj i ZACOMMITUJ root `package-lock.json` (`npm install --package-lock-only`
#      w root-cie — root package.json ma już devDep semantic-release + pluginy).
#   2. Ustaw CI/CD var `GITLAB_TOKEN` (scope: api).
#   3. Tag bazowy `v0.1.0` już istnieje (bez niego pierwsze wydanie wyszłoby jako 1.0.0).
#   4. Uzgodnij `CHANGELOG.md` — jest pisany RĘCZNIE i ma 818 KB; plugin
#      @semantic-release/changelog dopisuje swoją sekcję na górze. Zdecyduj, czy
#      generowane wpisy mają dokładać się do istniejącego pliku (jak zrobił to E-Bot,
#      dokumentując punkt przejścia w `.releaserc.json` → `changelogTitle`), czy release
#      ma CHANGELOG-a w ogóle nie dotykać.
#   5. Dopiero wtedy ZDEJMIJ `allow_failure: true` — i popraw `docs/MAINTENANCE.md`.
release:
  stage: release
  image: node:22-bookworm-slim
  needs: ["test:unit:web", "test:integration:web", "build:web"]
  allow_failure: true
  rules:
    # tylko realny push do main — NIE harmonogramy (żeby nocny skan/renovate nie wydał wersji)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  variables:
    GIT_DEPTH: "0"             # semantic-release potrzebuje pełnej historii + tagów
    GIT_STRATEGY: clone
  cache:
    key: release-npm
    paths:
      - node_modules/
  before_script:
    # PRECHECK — nazwij brakujący warunek, zamiast dać `npm ci` wywalić się z generycznym
    # „The `npm ci` command can only install with an existing package-lock.json". To jest
    # cała różnica między „job jest pomarańczowy, pewnie tak ma być" a „job mówi, co zrobić".
    - |
      if [ ! -f package-lock.json ]; then
        echo "═══════════════════════════════════════════════════════════════════"
        echo "RELEASE POMINIĘTY: brak root package-lock.json."
        echo ""
        echo "semantic-release instaluje się tu przez 'npm ci', które BEZ lockfile'a"
        echo "kończy się błędem — więc żadne wydanie nigdy nie powstało (1 ręczny tag,"
        echo "0 commitów chore(release) na 1005 commitów historii)."
        echo ""
        echo "Napraw: npm install --package-lock-only  (w root-cie) i zacommituj wynik."
        echo "Pełna instrukcja: komentarz nad jobem 'release' w .gitlab-ci.yml."
        echo "═══════════════════════════════════════════════════════════════════"
        exit 1
      fi
    # node:*-slim nie ma gita ani certyfikatów CA — wymagane przez semantic-release.
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - npm ci --ignore-scripts $NPM_FLAGS   # root deps; --ignore-scripts pomija `prepare`(lefthook)
  script:
    - npx semantic-release
  interruptible: false

# ═════════════════════════════════════════════════════════════════════════════
#  RENOVATE — aktualizacje zależności NATYWNIE w GitLab (dedykowany harmonogram)
# ═════════════════════════════════════════════════════════════════════════════
# Dependabot działa tylko na GitHubie (read-only mirror) → jego PR-y nie trafiają do
# GitLaba (źródło prawdy). Renovate w dedykowanym harmonogramie (zmienna RENOVATE=true)
# otwiera MR-y bezpośrednio w GitLab. Wymaga CI/CD var RENOVATE_TOKEN (GitLab PAT,
# scope api + write_repository). allow_failure:true — brak tokenu nie czerwieni
# dedykowanego pipeline'u renovate (widoczne jako ostrzeżenie).
renovate:
  stage: security
  image:
    name: renovate/renovate:39
    entrypoint: [""]
  needs: []
  allow_failure: true
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "https://gitlab.com/api/v4/"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "Gh0s777tt/ghost-empire"
    LOG_LEVEL: info
  script:
    - renovate
  rules: !reference [.rules_renovate, rules]
  interruptible: false
